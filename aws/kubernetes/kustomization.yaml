apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../kubernetes

images:
  - name: greg12348/mall-product-service
    newName: 753974169033.dkr.ecr.us-east-1.amazonaws.com/mall-product-service
    newTag: aws-test-1
  - name: greg12348/mall-order-service
    newName: 753974169033.dkr.ecr.us-east-1.amazonaws.com/mall-order-service
    newTag: aws-test-1
  - name: greg12348/mall-api-gateway
    newName: 753974169033.dkr.ecr.us-east-1.amazonaws.com/mall-api-gateway
    newTag: aws-test-1

replicas:
  - name: product-service
    count: 1

patches:
  - path: product-service-resources.yaml
  - path: order-service-resources.yaml
  - path: api-gateway-resources.yaml
  - path: product-mysql-resources.yaml
  - path: order-mysql-resources.yaml
  - path: kafka-resources.yaml
