apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: mall
spec:
  selector:
    app: product-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: mall
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      annotations:
        demo-version: v1
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: greg12348/mall-product-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PRODUCT_DB_URL
              value: jdbc:mysql://product-mysql:3306/mall_product
            - name: PRODUCT_DB_USERNAME
              value: mall
            - name: PRODUCT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-mysql-secret
                  key: MYSQL_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
