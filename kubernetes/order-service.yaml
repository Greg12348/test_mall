apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: mall
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: mall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: greg12348/mall-order-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: ORDER_DB_URL
              value: jdbc:mysql://order-mysql:3306/mall_order
            - name: ORDER_DB_USERNAME
              value: mall
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-mysql-secret
                  key: MYSQL_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SERVICES_PRODUCT_URL
              value: http://product-service:8082
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
